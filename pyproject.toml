[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decider-triage"
version = "0.1.0"
description = "Support triage agent: Strands Decider 2B makes the routine decisions, Amazon Bedrock writes the replies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["strands", "decider", "agents", "aws", "bedrock", "triage", "guardrails"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "strands-agents>=1.61.1",
    "httpx>=0.27",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff==0.17.2",
    "build>=1.2",
    "twine>=5",
]

[project.scripts]
triage-agent = "triage_agent.cli:main"
triage-bench = "triage_agent.bench:main"
triage-fake-decider = "triage_agent.fake_decider:main"
triage-ui = "triage_agent.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
triage_agent = ["data/*.jsonl", "data/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "."]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["triage_agent"]
