name: Release

# Push a tag like v0.1.0 to build, publish to PyPI (Trusted Publishing, no token stored),
# and attach the artifacts to a GitHub release.
#
# One-time setup on pypi.org: add a "pending publisher" for this repo, workflow
# "release.yml", environment "pypi". Then create a GitHub environment named "pypi".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match package version
        run: |
          pkg=$(python - <<'EOF'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          EOF
          )
          [ "v$pkg" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$pkg"; exit 1; }
      - run: pip install build twine pytest httpx strands-agents && pip install -e .
      - run: pytest
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
